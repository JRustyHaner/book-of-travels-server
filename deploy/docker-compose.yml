services:
  master:
    build:
      context: ..
      dockerfile: deploy/master.Dockerfile
    environment:
      BOT_MASTER_HOST: 0.0.0.0
      BOT_MASTER_PORT: "1234"
      BOT_HTTP_PORT: "8080"
      # Hostname advertised to clients for the game server (see instance below)
      BOT_PUBLIC_HOST: ${BOT_PUBLIC_HOST:-braid-connect.flightlessbirdlabs.io}
      # Admin token for POST /admin/invite (generate one, keep secret)
      BRAID_ADMIN_TOKEN: ${BRAID_ADMIN_TOKEN:?set in .env}
    volumes:
      - master-data:/app/data
    restart: unless-stopped

  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: bot
      MARIADB_USER: bot
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubot", "-p${MARIADB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  instance:
    build:
      context: ..
      dockerfile: deploy/instance.Dockerfile
    environment:
      MDY_DB_URL: "Server=mariadb;Port=3306;Database=bot;Uid=bot;Pwd=${MARIADB_PASSWORD}"
      MDY_INSTANCE_SERVER: "master:1234"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "50050:50050" # Mirror/TCP gameplay — open on the host firewall
    volumes:
      - ${BRAID_GAME_DIR:?set BRAID_GAME_DIR (host game dir with BepInEx installed)}:/game
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["caddy"] # omit with: docker compose up -d (see deploy/README "Existing Caddy host")
    ports:
      - "80:80"
      - "443:443"
      - "1234:1234" # braid-connect gRPC (h2c) — open on the host firewall
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/braid-site:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  master-data:
  mariadb-data:
  caddy-data:
  caddy-config:
